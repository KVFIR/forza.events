name = "forza-events-supabase-proxy"
main = "cloudflare/worker.js"
compatibility_date = "2024-07-01"

# Intercepts before Railway: Supabase proxy (dns_loop) + event link previews for crawlers.
[[routes]]
pattern = "forza.events/supabase/*"
zone_name = "forza.events"

[[routes]]
pattern = "forza.events/event/*"
zone_name = "forza.events"

[[routes]]
pattern = "forza.events/"
zone_name = "forza.events"

[[routes]]
pattern = "forza.events/*"
zone_name = "forza.events"

[vars]
SUPABASE_ORIGIN = "https://uoysqfczahqmctbrrizn.supabase.co"
SITE_ORIGIN = "https://forza.events"
RAILWAY_ORIGIN = "https://forzaevents.up.railway.app"
# Secret (wrangler secret put SUPABASE_ANON_KEY): required for /event/* link previews.
