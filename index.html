<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://discord.com https://*.discord.com https://*.discordsays.com; frame-ancestors https://*.discord.com https://*.discordsays.com;"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      name="description"
      content="Community events for Forza Horizon, delivered as a Discord Activity."
    />
    <meta property="og:title" content="FORZA.EVENTS" />
    <meta
      property="og:description"
      content="Community events for Forza Horizon, delivered as a Discord Activity."
    />
    <meta property="og:image" content="https://forza.events/og/site.webp" />
    <meta property="og:url" content="https://forza.events/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FORZA.EVENTS" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FORZA.EVENTS" />
    <meta
      name="twitter:description"
      content="Community events for Forza Horizon, delivered as a Discord Activity."
    />
    <meta name="twitter:image" content="https://forza.events/og/site.webp" />
    <title>FORZA.EVENTS</title>
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <link rel="icon" type="image/webp" href="/logo/logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Critical paint before Tailwind — prevents default white body margin/frame */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: #06060e;
        overscroll-behavior: none;
      }

      html {
        background-image:
          radial-gradient(ellipse 90% 45% at 50% -5%, rgba(139, 92, 246, 0.11) 0%, transparent 100%),
          radial-gradient(ellipse 45% 35% at 95% 95%, rgba(34, 211, 238, 0.05) 0%, transparent 100%);
      }

      /* Keep in sync with AppBootScreen + body::before in index.css */
      #boot-splash {
        box-sizing: border-box;
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        width: 100%;
        min-height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        color: #4b5680;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background-color: #06060e;
        background-image:
          radial-gradient(ellipse 90% 45% at 50% -5%, rgba(139, 92, 246, 0.11) 0%, transparent 100%),
          radial-gradient(ellipse 45% 35% at 95% 95%, rgba(34, 211, 238, 0.05) 0%, transparent 100%);
      }

      #boot-splash .boot-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      #boot-splash .boot-logo {
        display: block;
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
        object-fit: contain;
        border: 0;
      }

      #boot-splash .boot-wordmark {
        display: inline-block;
        margin: 0;
        transform: skewX(-10deg);
        transform-origin: left;
        font-size: 1.125rem;
        font-weight: 800;
        letter-spacing: -0.025em;
        color: #fff;
        user-select: none;
      }

      #boot-splash .boot-accent {
        background: linear-gradient(90deg, #8b5cf6, #a78bfa);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      #boot-splash .boot-spinner {
        width: 2rem;
        height: 2rem;
        color: rgba(107, 114, 138, 0.55);
        animation: boot-spin 0.8s linear infinite;
      }

      #boot-splash .boot-label {
        margin: 0;
        font-size: 0.875rem;
        color: #4b5680;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite" aria-busy="true">
        <div class="boot-brand">
          <picture>
            <source srcset="/logo/logo.webp 1x, /logo/logo@2x.webp 2x" type="image/webp" />
            <img
              class="boot-logo"
              src="/logo/logo.png"
              alt=""
              width="40"
              height="40"
              decoding="async"
            />
          </picture>
          <span class="boot-wordmark" aria-label="FORZA.EVENTS">
            FORZA<span class="boot-accent">.EVENTS</span>
          </span>
        </div>
        <svg
          class="boot-spinner"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <p class="boot-label">Loading</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
