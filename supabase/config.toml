# Supabase local config — see https://supabase.com/docs/guides/cli/config
project_id = "forza-events"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[storage]
enabled = true

# Edge Functions use custom Discord token auth (x-discord-access-token), not Supabase JWT.
[functions.token-exchange]
verify_jwt = false

[functions.list-guilds]
verify_jwt = false

[functions.list-guild-members]
verify_jwt = false

[functions.list-channels]
verify_jwt = false

[functions.validate-channel]
verify_jwt = false

[functions.publish-event]
verify_jwt = false

[functions.interactions-endpoint]
verify_jwt = false

[functions.save-event]
verify_jwt = false

[functions.event-participation]
verify_jwt = false

[functions.submit-results]
verify_jwt = false

[functions.user-profile]
verify_jwt = false

[functions.launch-intent]
verify_jwt = false

[functions.browse-events]
verify_jwt = false

[functions.host-drafts]
verify_jwt = false

[functions.upload-cover]
verify_jwt = false
